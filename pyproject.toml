[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "make-it-stick-trainer"
version = "0.1.0"
description = "认知天性学习策略训练器：检索练习 + 间隔重复 + 交错练习 + 生成性自评 + 反思"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["spaced-repetition", "interleaving", "retrieval-practice", "sm2", "learning", "cli"]
dependencies = [
  "SQLAlchemy>=2.0",
  "rich>=13.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
# httpx2 is what starlette's TestClient imports on recent releases, httpx on
# older ones; tests skip themselves if neither is present.
dev = ["pytest>=8.0", "httpx2>=2.0", "httpx>=0.27"]

[project.scripts]
mist = "mist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mist = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
